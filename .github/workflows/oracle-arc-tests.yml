name: Oracle Arc tests

on:
  push:
    branches:
      - feat/oracle-arc-core
      - feat/oracle-arc-postgres-a8-2026-11-15
  pull_request:
    branches:
      - feat/oracle-arc-core

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oracle_arc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oracle_arc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run full test suite
        run: python -W error::ResourceWarning -m unittest discover -s tests -t .
      - name: Run UNIBUD registry integration tests
        run: python -m unittest tests.test_unibud_agents tests.test_unibud_agents_gateway -v
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Verify PostgreSQL control-plane migration and role boundaries
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d oracle_arc_test -f database/migrations/0001_arc_control_plane.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d oracle_arc_test -f database/tests/0001_arc_control_plane.test.sql
      - name: Verify Python runtime persistence against PostgreSQL
        env:
          ORACLE_ARC_TEST_DATABASE_URL: postgresql://oracle_arc_runtime_ci:oracle_arc_runtime_ci_only@127.0.0.1:5432/oracle_arc_test
          ORACLE_ARC_TEST_PROVISIONER_DATABASE_URL: postgresql://oracle_arc_provisioner_ci:oracle_arc_provisioner_ci_only@127.0.0.1:5432/oracle_arc_test
        run: python -m unittest tests.test_postgres_control_plane -v
